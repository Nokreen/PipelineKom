name: PipelineKom CI/CD

on:
  pull_request:
    branches:
      - dev
    types:
      - closed

env:
  PROJECT_NAME: PipelineKom

jobs:
  quality-check:
    name: Quality Check
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Run Analysis
        id: analysis
        run: |
          echo "========================================="
          echo "PipelineKom: Quality Check"
          echo "========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "Status: PASSED"
          echo "========================================="
          
          mkdir -p reports
          echo "{\"status\": \"passed\", \"timestamp\": \"$(date -Iseconds)\"}" > reports/quality-report.json
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/

  telegram-notify:
    name: Telegram Notification
    needs: quality-check
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build Notifier
        run: |
          cd scripts
          javac PipelineKomNotifier.java
          cd ..
      
      - name: Send Notification
        env:
          PIPELINEKOM_TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PIPELINEKOM_TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cd scripts
          java PipelineKomNotifier
          cd ..
